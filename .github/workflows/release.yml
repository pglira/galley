# Builds the Linux packages (.deb, .rpm, AppImage) for a version tag and
# publishes them as a GitHub Release.
#
# Each file is attached twice: with the version in its name, and with a fixed
# name, so that https://github.com/<repo>/releases/latest/download/<fixed name>
# always gives the newest package.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  linux:
    # The oldest supported Ubuntu gives the oldest glibc, so the packages
    # also run on older distributions.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev libssl-dev libxdo-dev \
            build-essential file patchelf

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Check the tag against the app version
        run: |
          version=$(node -p "require('./src-tauri/tauri.conf.json').version")
          if [[ "${GITHUB_REF_NAME}" != "v${version}" ]]; then
            echo "error: tag ${GITHUB_REF_NAME} does not match version ${version}" >&2
            exit 1
          fi

      - run: pnpm install --frozen-lockfile

      - run: pnpm test

      - name: Build the packages
        run: pnpm tauri build

      - name: Collect the packages
        run: |
          bundle=src-tauri/target/release/bundle
          mkdir -p out
          cp $bundle/deb/*.deb $bundle/rpm/*.rpm $bundle/appimage/*.AppImage out/
          cp $bundle/deb/*.deb out/galley_amd64.deb
          cp $bundle/rpm/*.rpm out/galley.x86_64.rpm
          cp $bundle/appimage/*.AppImage out/Galley_amd64.AppImage
          (cd out && sha256sum * > SHA256SUMS)
          ls -l out

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" out/* \
            --title "Galley ${GITHUB_REF_NAME#v}" \
            --generate-notes \
            --verify-tag
