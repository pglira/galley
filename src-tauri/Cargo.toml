[package]
name = "galley"
version = "0.1.3"
description = "Review Markdown documents from AI agents"
authors = ["Garrett Graves", "Philipp Glira"]
edition = "2021"

[lib]
name = "galley_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
thiserror = "2"
parking_lot = "0.12"
dirs = "5"
percent-encoding = "2"
claude-codes = { version = "2.1.323", default-features = false, features = ["async-client"] }
tokio = { version = "1", features = ["process", "io-util", "sync", "macros", "rt"] }
which = "8"
uuid = "1"

[target.'cfg(target_os = "linux")'.dependencies]
glib = "0.18"
gtk = "0.18"
webkit2gtk = "2.0"
gio = "0.18"
cairo-rs = { version = "0.18", features = ["png"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
